<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore NFTs — BlueSky Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        openseaDark: '#04111d',
                        openseaCard: '#262b2f',
                        openseaBlue: '#2081e2',
                        openseaHover: '#1868b7'
                    }
                }
            }
        }

        async function connectWallet() {
            let provider, address;
            try {
                if (typeof window.ethereum !== 'undefined') {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    address = accounts[0];
                } else {
                    const randomWallet = ethers.Wallet.createRandom();
                    address = randomWallet.address;
                    alert(`No Web3 extension detected. Generated test session wallet: ${address.substring(0,6)}...`);
                }
                const shortAddr = address.substring(0, 6) + '...' + address.substring(address.length - 4);
                document.querySelectorAll('.wallet-btn').forEach(btn => {
                    btn.innerHTML = `<i class="fa-solid fa-wallet mr-2"></i> ${shortAddr}`;
                    btn.classList.add('bg-green-600', 'hover:bg-green-700');
                    btn.classList.remove('bg-openseaBlue', 'hover:bg-openseaHover');
                });
            } catch (error) {
                console.error("Connection error", error);
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-openseaDark text-white font-sans antialiased selection:bg-openseaBlue selection:text-white">

    <nav class="flex items-center justify-between px-6 py-4 border-b border-gray-800 sticky top-0 bg-openseaDark/90 backdrop-blur-md z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 bg-openseaBlue rounded-full flex items-center justify-center text-xl font-bold shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <span class="text-xl font-bold tracking-tight">BlueSky</span>
        </div>
        
        <div class="hidden md:flex items-center bg-[#202225] rounded-xl px-4 py-3 w-96 border border-transparent focus-within:border-openseaBlue transition">
            <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3"></i>
            <input type="text" placeholder="Search items, collections, and accounts" class="bg-transparent border-none outline-none text-sm w-full text-gray-200 placeholder-gray-400">
        </div>

        <div class="flex items-center space-x-6 font-medium text-sm">
            <a href="index.html" class="hover:text-openseaBlue transition">Home</a>
            <a href="explore.html" class="text-openseaBlue font-bold">Explore</a>
            <a href="profile.html" class="hover:text-openseaBlue transition">Profile</a>
            <button onclick="connectWallet()" class="wallet-btn bg-openseaBlue hover:bg-openseaHover px-5 py-2.5 rounded-xl font-semibold transition shadow-lg shadow-blue-500/20">
                Connect Wallet
            </button>
        </div>
    </nav>

    <div class="flex min-h-screen">
        <aside class="w-72 border-r border-gray-800 p-6 hidden lg:block sticky top-20 h-[calc(100vh-5rem)] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-lg flex items-center"><i class="fa-solid fa-filter mr-2 text-openseaBlue"></i> Filters</h3>
                <span class="text-xs text-gray-400 cursor-pointer hover:text-white">Clear All</span>
            </div>
            <div class="border-b border-gray-800 pb-4 mb-4">
                <h4 class="font-semibold text-sm mb-3 text-gray-300">Status</h4>
                <div class="space-y-2">
                    <label class="flex items-center space-x-3 text-sm cursor-pointer"><input type="checkbox" class="accent-openseaBlue w-4 h-4 rounded"> <span>Buy Now</span></label>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-6 lg:p-10">
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight">Explore All NFTs</h1>
                <p class="text-gray-400 text-sm mt-1">Browse and discover verified digital collectibles.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <div onclick="window.location.href='item.html'" class="bg-[#303339] border border-gray-800 rounded-2xl overflow-hidden hover:border-gray-600 transition cursor-pointer group">
                    <div class="h-64 bg-cover bg-center group-hover:scale-105 transition duration-300" style="background-image: url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=500&auto=format&fit=crop');"></div>
                    <div class="p-4">
                        <p class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Abstract Dimensions</p>
                        <h3 class="font-bold text-base mb-2 truncate">Prism Core #0192</h3>
                        <div class="flex justify-between items-center bg-[#202225] p-2.5 rounded-xl">
                            <div>
                                <span class="text-[10px] text-gray-400 block">Price</span>
                                <span class="text-sm font-bold flex items-center"><i class="fa-brands fa-ethereum mr-1 text-openseaBlue"></i> 0.82 ETH</span>
                            </div>
                            <button class="bg-openseaBlue hover:bg-openseaHover text-xs font-semibold px-3 py-1.5 rounded-lg transition">Buy</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

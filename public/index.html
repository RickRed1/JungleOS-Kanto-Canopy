<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrisM-Settlement | Enterprise CEX</title>
    <style>
        :root {
            --bg-deep: #0B1426;
            --card-bg: #121E36;
            --border-color: #1E293B;
            --accent-blue: #00F0FF;
            --accent-glow: rgba(0, 240, 255, 0.15);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --success-green: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; padding: 24px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .logo-area { text-align: center; margin-bottom: 28px; }
        .logo-area h1 { font-size: 22px; font-weight: 700; color: var(--accent-blue); letter-spacing: 1px; }
        .logo-area p { font-size: 12px; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 1.5px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 14px 16px; background-color: #0A1120; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px var(--accent-glow); }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00F0FF 0%, #0070F3 100%); border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); margin-top: 12px; }
        .btn-secondary:hover { border-color: var(--text-main); color: var(--text-main); }
        .status-msg { margin-top: 16px; font-size: 13px; text-align: center; color: var(--success-green); }
        .error-msg { margin-top: 16px; font-size: 13px; text-align: center; color: #EF4444; }
        .hidden { display: none; }
        .qr-container { text-align: center; margin: 16px 0; }
        .qr-container img { max-width: 150px; border-radius: 8px; border: 4px solid #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-area">
                <h1>PRISMS_SETTLEMENT</h1>
                <p>Institutional Grade CEX Gateway</p>
            </div>

            <!-- Login View -->
            <div id="loginView">
                <div class="form-group">
                    <label>Operator Email</label>
                    <input type="email" id="email" placeholder="operator@godsourceglobal.com">
                </div>
                <div class="form-group">
                    <label>Secure Passcode</label>
                    <input type="password" id="passcode" placeholder="••••••••••••">
                </div>
                <div class="form-group hidden" id="totpGroup">
                    <label>2FA Authenticator Code</label>
                    <input type="text" id="totpToken" placeholder="123 456" maxlength="6">
                </div>
                <button class="btn" onclick="initializeSession()">Initialize Session</button>
                <button class="btn btn-secondary" onclick="showRegisterView()">Register New Node</button>
                <div id="loginFeedback"></div>
            </div>

            <!-- Register View -->
            <div id="registerView" class="hidden">
                <div class="form-group">
                    <label>Node Operator Email</label>
                    <input type="email" id="regEmail" placeholder="operator@godsourceglobal.com">
                </div>
                <div class="form-group">
                    <label>Create Secure Passcode</label>
                    <input type="password" id="regPasscode" placeholder="••••••••••••">
                </div>
                <button class="btn" onclick="registerNode()">Generate Node Credentials</button>
                <button class="btn btn-secondary" onclick="showLoginView()">Back to Login</button>
                <div id="regFeedback"></div>
            </div>

            <!-- 2FA Setup View -->
            <div id="setup2faView" class="hidden">
                <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 12px;">Scan QR code with Google Authenticator or Authy:</p>
                <div class="qr-container" id="qrCodeBox"></div>
                <div class="form-group">
                    <label>Enter 6-Digit Code to Verify</label>
                    <input type="text" id="verifyToken" placeholder="000000" maxlength="6">
                </div>
                <button class="btn" onclick="verifyAndEnable2FA()">Activate Security Setup</button>
                <div id="setupFeedback"></div>
            </div>
        </div>
    </div>

    <script>
        let pendingEmail = '';

        function showRegisterView() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('registerView').classList.remove('hidden');
        }

        function showLoginView() {
            document.getElementById('registerView').classList.add('hidden');
            document.getElementById('setup2faView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
        }

        async function registerNode() {
            const email = document.getElementById('regEmail').value;
            const passcode = document.getElementById('regPasscode').value;
            const feedback = document.getElementById('regFeedback');

            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, passcode })
            });
            const data = await res.json();

            if (data.success) {
                pendingEmail = email;
                document.getElementById('registerView').classList.add('hidden');
                document.getElementById('setup2faView').classList.remove('hidden');
                document.getElementById('qrCodeBox').innerHTML = `<img src="${data.qrCode}" alt="2FA QR Code">`;
            } else {
                feedback.className = 'error-msg';
                feedback.innerText = data.error;
            }
        }

        async function verifyAndEnable2FA() {
            const token = document.getElementById('verifyToken').value;
            const feedback = document.getElementById('setupFeedback');

            const res = await fetch('/api/auth/verify-setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingEmail, token })
            });
            const data = await res.json();

            if (data.success) {
                feedback.className = 'status-msg';
                feedback.innerText = data.message;
                setTimeout(showLoginView, 2000);
            } else {
                feedback.className = 'error-msg';
                feedback.innerText = data.error;
            }
        }

        async function initializeSession() {
            const email = document.getElementById('email').value;
            const passcode = document.getElementById('passcode').value;
            const token = document.getElementById('totpToken').value;
            const feedback = document.getElementById('loginFeedback');

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, passcode, token })
            });
            const data = await res.json();

            if (res.status === 205) {
                document.getElementById('totpGroup').classList.remove('hidden');
                feedback.className = 'status-msg';
                feedback.innerText = data.message;
                return;
            }

            if (data.success) {
                feedback.className = 'status-msg';
                feedback.innerText = 'Session initialized successfully. Loading terminal view...';
                localStorage.setItem('prism_jwt', data.token);
                // Redirect or load exchange dashboard view here
            } else {
                feedback.className = 'error-msg';
                feedback.innerText = data.error;
            }
        }
    </script>
</body>
</html>
